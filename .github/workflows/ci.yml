name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: flake8 .
      - run: pytest -q
      - name: Build the image
        run: docker build -t visit-counter:ci app
      - name: Smoke test the full stack
        run: |
          docker compose up -d --build --wait
          curl -fsS http://localhost:8080/ | tee /dev/stderr | grep -q visits
          docker compose down -v
